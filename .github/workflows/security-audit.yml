name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-audit.yml
  # Advisory baru bisa muncul tanpa ada perubahan kode
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm audit (high ke atas)
        run: npm audit --audit-level=high
